# The project is its own pnpm workspace root, so pnpm never walks up into a
# parent workspace when installing.
packages:
  - .
minimumReleaseAgeExclude:
  - '@deepseek-ai/cosmokit@1.8.4 || 1.8.5'
  - '@deepseek-ai/dsh-brand@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-client-connection@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-client-locale@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-client-ui-conversation@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-client-ui-primitives@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-client-ui-settings@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-client-ui-slots@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-credentials@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-host-webserver@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-invariants@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-scope@0.1.7-alpha.2'
  - '@deepseek-ai/schemastery@3.18.3 || 3.18.4'
